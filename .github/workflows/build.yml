name: Build IPTV Player APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create Flutter project scaffold
        run: |
          flutter create /tmp/iptv_build \
            --org com.iptvplayer \
            --project-name iptv_app \
            --platforms android

      - name: Inject custom source files
        run: |
          cp pubspec.yaml /tmp/iptv_build/pubspec.yaml
          rm -rf /tmp/iptv_build/lib
          cp -r lib /tmp/iptv_build/lib

      - name: Patch Android configuration
        run: |
          MANIFEST="/tmp/iptv_build/android/app/src/main/AndroidManifest.xml"
          SETTINGS="/tmp/iptv_build/android/settings.gradle"
          GRADLE="/tmp/iptv_build/android/app/build.gradle"

          # Allow cleartext HTTP traffic for IPTV streams
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$MANIFEST"

          # Fix Kotlin version in settings.gradle (if it exists)
          if [ -f "$SETTINGS" ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.25"/' "$SETTINGS"
            echo "=== settings.gradle ==="
            cat "$SETTINGS"
          fi

          # Fix Kotlin version in build.gradle (older Flutter format)
          if [ -f "$GRADLE" ]; then
            sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.25'/" "$GRADLE"
            echo "=== app/build.gradle ==="
            cat "$GRADLE"
          fi

          echo "=== AndroidManifest.xml ==="
          cat "$MANIFEST"

      - name: Install dependencies
        working-directory: /tmp/iptv_build
        run: flutter pub get

      - name: Build release APK
        working-directory: /tmp/iptv_build
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player-APK
          path: /tmp/iptv_build/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
